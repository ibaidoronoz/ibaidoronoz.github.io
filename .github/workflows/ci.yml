name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Fail if source maps leaked into the build
        run: |
          if find dist -name '*.map' | grep -q .; then
            echo "Source maps found in dist/"; exit 1
          fi
      - name: Fail if a shipped image is over 300 KB
        run: |
          find dist -type f \( -name '*.png' -o -name '*.webp' -o -name '*.jpg' \) -size +300k -print | tee heavy.txt
          if [ -s heavy.txt ]; then echo "Images over 300 KB found"; exit 1; fi
