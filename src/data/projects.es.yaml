# Spanish text for every project. Structure, logos and stack stay in projects.yaml.
# One entry per id in the same order. `highlights`, `underTheHood`, `fact.label` and
# `components.role` are optional: whatever is missing falls back to the English value.
# Nothing here may reveal LAN hosts, real financial data, secrets or employer information.

- id: kizuna
  oneLiner: "Agentes de IA que resuelven un ticket de principio a fin: planificado, con puerta humana y auditable."
  highlights:
    - "Cada ejecución sigue un playbook versionado, no un prompt que alguien olvidó"
    - "Un puerto para ocho runtimes de agentes; el flujo nunca sabe cuál ejecutó"
    - "Puertas humanas por coste, tamaño del diff, rutas sensibles y tests en rojo"
  underTheHood:
    - "Orquestador duradero sobre SQLite: una entrada de journal por transición, presupuesto por ejecución, cancelación cooperativa"
    - "Contratos Zod en dominio, adaptadores e integraciones; un proceso Fastify sirve API y UI"
    - "La salida del agente se valida contra un esquema y se repara antes de que corra el siguiente nodo"
    - "Nueve playbooks de auditoría de solo lectura aplicados al propio sistema: 164 hallazgos priorizados"
  fact: { label: "hallazgos en una auditoría" }

- id: crypto-market
  diagram:
    nodes:
      - { title: Post, sub: 'menú del moderador' }
      - { title: Dashboard, sub: 'muchos tokens' }
      - { title: Ficha de token, sub: 'un solo token' }
      - { title: Cron, sub: 'refresco cada 15 min' }
  oneLiner: "Dashboards de cripto dentro de Reddit, actualizados cada quince minutos y configurados por comunidad."
  highlights:
    - "Publicado en la plataforma de desarrollo de Reddit e instalable subreddit a subreddit"
    - "Dos tipos de post: dashboard multi-token y ficha de un solo token"
    - "Escrito a mano en 2025, reconstruido en Devvit Web con agentes en 2026"
    - "Los niveles free, demo y pro marcan el refresco de quince a cinco minutos"
  underTheHood:
    - "Devvit Web 0.12: React 19 y Vite en cliente, Express en servidor, Redis como almacenamiento y cron cada quince minutos"
    - "Permisos de red limitados a los dos hosts de CoinGecko"
    - "Sparklines calculadas en servidor y cacheadas, para que un post popular no machaque la API"
  fact: { label: "refresco sin clave" }

- id: plutus
  diagram:
    nodes:
      - { title: Fuentes, sub: '6 exchanges · 17 cadenas' }
      - { title: Importadores, sub: 'API + CSV' }
      - { title: Conciliación, sub: 'emparejar transferencias' }
