- id: engineering-platform
  oneLiner: "Veinte repositorios, un estándar de ingeniería y la automatización que lo mantiene honesto."
  highlights:
    - "Un solo hogar por skill: un slug duplicado rompe el validador de la flota"
    - "Cada repositorio arranca del mismo contexto, probado"
    - "La puerta de entrada y el panel de operaciones comparten un catálogo de servicios"
  underTheHood:
    - "check.py --fleet valida puntos de entrada de agentes, flujo de git y reglas de secretos en cada repositorio hermano"
    - "Por defecto solo carga la descripción corta de cada skill; el cuerpo se carga cuando hace falta"
  fact: { label: "repositorios, un contrato" }
  components:
    - { name: Prometheus, role: contexto de IA compartido }
    - { name: Torii, role: una puerta de entrada }
    - { name: Kagi, role: acceso único }
    - { name: Festive, role: motor de UI compartido }

- id: txango
  diagram:
    nodes:
      - { title: Mapa, sub: 'vector · sin conexión' }
      - { title: Ruta, sub: 'catálogo o GPX' }
      - { title: Marcha, sub: 'GPS · avisos' }
      - { title: Traza, sub: 'sobrevive al cierre' }
