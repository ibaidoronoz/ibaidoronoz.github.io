  oneLiner: "Navegación de senderismo con el mapa dentro: sin cobertura, sin cuenta y sin servicios de Google."
  highlights:
    - "2.034 rutas, 6.404 cumbres y 19.737 puntos de interés incluidos sin conexión"
    - "Mapas vectoriales con sombreado, más fotos aéreas guardadas antes de salir"
    - "Avisos repetidos de fuera de ruta, aviso de puesta de sol y 112 a un toque"
    - "108 tests unitarios; castellano, euskera e inglés"
  underTheHood:
