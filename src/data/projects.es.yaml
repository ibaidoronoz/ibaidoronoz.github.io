- id: kairos
  diagram:
    nodes:
      - { title: Datos, sub: '5 fuentes de precio' }
      - { title: Régimen, sub: 'VIX · curva' }
      - { title: Puntuación, sub: 'por activo' }
      - { title: Plan, sub: 'DCA mensual' }
  oneLiner: "Cuándo comprar, respaldado por un backtest, y la disciplina de borrar lo que no lo pasó."
  highlights:
    - "Detección de régimen por reglas sobre VIX, curva de tipos y liquidez"
    - "Backtesting walk-forward contra DCA simple"
    - "Recortó su función estrella cuando los números dijeron que no"
  underTheHood:
