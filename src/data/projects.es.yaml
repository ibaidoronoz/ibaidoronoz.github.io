  oneLiner: "Seis exchanges, diecisiete blockchains, un informe FIFO correcto para Hacienda."
  highlights:
    - "APIs y CSV de seis exchanges, más carteras en diecisiete cadenas"
    - "Coste FIFO para IRPF y modelo 721"
    - "Auditorías con agentes sobre una copia aislada de la base encontraron bugs críticos del motor"
  underTheHood:
