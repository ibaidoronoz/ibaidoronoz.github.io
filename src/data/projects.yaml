# Single source of truth for every project shown on the site.
# tier: featured (needs a case study in src/content/case-studies/<id>.md) | selected | archive
# oneLiner: benefit first, max 140 characters. underTheHood: the technical layer.
# Nothing in this file may reveal LAN hosts, real financial data, secrets or employer information.

# ───────────── Featured ─────────────
- id: kizuna
  logo: /logos/kizuna.png
  accent: '#8b5cf6'
  name: Kizuna
  tier: featured
  order: 1
  areas: [ai-agents, platform]
  status: active
  oneLiner: "AI coding agents that work a ticket end to end: planned, gated by a human and fully auditable."
  fact: { value: '164', label: 'findings in one audit' }
  diagram: kizuna
  highlights:
    - "Every run follows a versioned playbook, not a prompt someone forgot"
    - "One port for eight agent runtimes; the workflow never knows which one ran"
    - "Human gates on cost, diff size, sensitive paths and failing tests"
  underTheHood:
    - "Durable orchestrator on SQLite: a journal entry per state transition, per-run budgets, cooperative cancellation"
    - "Zod contracts across domain, adapters and integrations; one Fastify process serves both API and UI"
    - "Agent output is validated against a schema and repaired before the next node runs"
    - "Nine read-only audit playbooks turned on the system itself: 164 prioritised findings"
  stack: [TypeScript, Node.js, Fastify, Drizzle, SQLite/libSQL, Zod, React, Vite, Vitest, Playwright]
  includes: [Kizuna Playbooks]

